name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: [3.6.0, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart run tool/check_core_imports.dart
      - run: dart analyze
      - run: dart test
        working-directory: packages/offline_cache_sync
      - run: dart test
        working-directory: packages/offline_cache_sync_test
      - run: INVARIANT_RUNS=500 dart test -t invariants
        working-directory: packages/offline_cache_sync_test
