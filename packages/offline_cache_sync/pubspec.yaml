name: offline_cache_sync
description: >-
  Offline-first data engine for Dart and Flutter. Keeps a durable outbox and a
  stale-while-revalidate cache consistent: pending edits survive restarts,
  refreshes never clobber them, eviction never loses them, retries never
  duplicate them.
version: 0.1.0
repository: https://github.com/guru-prasath-j/offline_cache_sync/tree/main/packages/offline_cache_sync
issue_tracker: https://github.com/guru-prasath-j/offline_cache_sync/issues
topics:
  - offline-first
  - cache
  - sync
  - offline
  - repository
resolution: workspace

environment:
  sdk: ^3.6.0

# The core has ZERO runtime dependencies. Keep it that way (see tool/check_core_imports.dart).
dependencies: {}

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
